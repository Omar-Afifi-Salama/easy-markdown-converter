name: Publish to npm and GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build TypeScript
        run: npm run build

      # 1. Publish to npmjs.com
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. Publish to GitHub Packages
      - name: Setup GitHub Packages Registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@omar-afifi-salama'

      - name: Scope package and publish to GitHub Packages
        run: |
          npm pkg set name="@omar-afifi-salama/easy-markdown-converter"
          npm version --no-git-tag-version --allow-same-version ${{ github.event.release.tag_name || '1.0.3' }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}